name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build libegl-dev libepoxy-dev libpulse-dev
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DANYPS5_RETRO_HOST_TESTS=ON
      - run: cmake --build build --parallel 3
      - run: TMPDIR=/tmp ctest --test-dir build --output-on-failure
      - name: Session tests
        run: |
          cmake -S src/core/test -B build/core -G Ninja -DANYPS5_RETRO_VULKAN=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build/core --parallel 3
          TMPDIR=/tmp ctest --test-dir build/core --output-on-failure
      - run: |
          mkdir -p dist
          cp build/anyps5-retro-host LICENSE README.md dist/
          cp build/tests/ps1_host_probe dist/
          (cd dist && sha256sum anyps5-retro-host > anyps5-retro-host.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: anyps5-retro-host-linux-x64
          path: dist/*
          retention-days: 14

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DANYPS5_RETRO_HOST_TESTS=ON
      - run: cmake --build build --parallel 3
      - run: ctest --test-dir build --output-on-failure
      - name: Session tests
        run: |
          cmake -S src/core/test -B build/core -G Ninja -DANYPS5_RETRO_VULKAN=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build/core --parallel 3
          ctest --test-dir build/core --output-on-failure
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/anyps5-retro-host.exe, LICENSE, README.md, build/tests/ps1_host_probe.exe dist/
          (Get-FileHash dist/anyps5-retro-host.exe -Algorithm SHA256).Hash.ToLower() | Set-Content dist/anyps5-retro-host.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: anyps5-retro-host-windows-x64
          path: dist/*
          retention-days: 14
